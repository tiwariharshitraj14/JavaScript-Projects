<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="./index.css">
    <title>Code_Editor</title>
</head>

<body>
    <div class="bg-red-500 h-lvh w-lvw flex overflow-hidden max-[800px]:flex-wrap">
        <div class="bg-slate-700 h-lvh basis-1/2 flex flex-col ">
            <div class="basis-1/2 ">
                <label class="bg-black text-red-600 p-3 text-2xl font-sans font-semibold block" >HTML</label>
                <textarea name="" id="" class="w-[100%] h-[90%] bg-slate-800 text-slate-50 outline-none p-2"></textarea>
            </div>
            <div class="basis-1/2"> 
                <label class="bg-black text-red-600 p-3 text-2xl font-sans font-semibold block ">CSS</label>
                <textarea name="" id="" class="w-[100%] h-[90%] bg-slate-800 text-slate-50 outline-none p-2"></textarea>
            </div>
           
        </div>
        <div class="bg-slate-300  h-lvh  basis-1/2">
            <label class="bg-white text-black p-3 text-2xl font-sans font-semibold block">OUTPUT</label>
             <iframe class=" w-[100%] h-[90%] text-black p-2 mt-2" ></iframe>
        </div>

    </div>

    <script src="./index.js"></script>
</body>

</html>
